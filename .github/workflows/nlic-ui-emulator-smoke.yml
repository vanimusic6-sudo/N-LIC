name: N-LIC UI runtime smoke (Android emulator)

on:
  push:
    branches: [fix/nlic-core-bay-ui-security-20261103]
    paths:
      - app/**
      - .github/workflows/nlic-ui-emulator-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nlic-ui-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  activity-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout native submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Configure Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Install Android SDK and pinned native toolchain
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          chmod +x ./gradlew

      - name: Launch emulator and exercise VPN server list
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Publish UI crash and instrumentation results
        if: always()
        uses: actions/upload-artifact@b7c85898a64796a41a2c67f0b5cc0db0c3cfbcea
        with:
          name: nlic-ui-emulator-diagnostics
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 5
