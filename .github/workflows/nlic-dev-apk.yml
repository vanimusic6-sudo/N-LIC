name: N-LIC Dev APK

on:
  push:
    branches: [master, feature/nlic-identity-security-20261103]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nlic-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed N-LIC Dev APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NLIC_DEV_STORE_PASSWORD: ${{ secrets.NLIC_DEV_STORE_PASSWORD }}
      NLIC_DEV_KEY_PASSWORD: ${{ secrets.NLIC_DEV_KEY_PASSWORD }}
      NLIC_DEV_KEY_ALIAS: ${{ secrets.NLIC_DEV_KEY_ALIAS }}
      NLIC_DEV_KEYSTORE_BASE64: ${{ secrets.NLIC_DEV_KEYSTORE_BASE64 }}
      NLIC_DEV_KEYSTORE_PATH: ${{ github.workspace }}/.signing/nlic-dev.p12

    steps:
      - name: Checkout including native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install native Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Restore DEV signing key (never publish it)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NLIC_DEV_KEYSTORE_BASE64"
          test -n "$NLIC_DEV_STORE_PASSWORD"
          test -n "$NLIC_DEV_KEY_PASSWORD"
          test -n "$NLIC_DEV_KEY_ALIAS"
          mkdir -p .signing
          chmod 700 .signing
          printf '%s' "$NLIC_DEV_KEYSTORE_BASE64" | base64 --decode > "$NLIC_DEV_KEYSTORE_PATH"
          chmod 600 "$NLIC_DEV_KEYSTORE_PATH"
          keytool -list -keystore "$NLIC_DEV_KEYSTORE_PATH" \
            -storepass:env NLIC_DEV_STORE_PASSWORD \
            -alias "$NLIC_DEV_KEY_ALIAS" > /dev/null

      - name: Verify least-privilege security baseline
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          android='{http://schemas.android.com/apk/res/android}'
          manifest=ET.parse('app/src/main/AndroidManifest.xml').getroot()
          forbidden={'android.permission.MANAGE_EXTERNAL_STORAGE',
                     'android.permission.READ_EXTERNAL_STORAGE',
                     'android.permission.WRITE_EXTERNAL_STORAGE'}
          permissions={e.get(android+'name') for e in manifest.findall('uses-permission')}
          assert not (permissions & forbidden), permissions & forbidden
          app=manifest.find('application')
          assert app is not None and app.get(android+'allowBackup') == 'false'
          assert app.get(android+'label') == '@string/app_name'
          for name in ('.activities.ToggleActivity', '.activities.SettingsActivity'):
              matches=[x for x in app.findall('activity') if x.get(android+'name')==name]
              assert len(matches)==1 and matches[0].get(android+'exported')=='false', name
          assert '<string name="app_name">N-LIC</string>' in Path('app/src/main/res/values/strings.xml').read_text()
          assert 'RECEIVER_NOT_EXPORTED' in Path('app/src/main/java/io/github/romanvht/byedpi/activities/MainActivity.kt').read_text()
          print('Security baseline checks passed')
          PY

      - name: Build signed DEV APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Locate and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f -name '*universal*debug*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            apk="$(find app/build/outputs/apk -type f -name '*debug*.apk' -print -quit)"
          fi
          test -s "$apk"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$signer"
          "$signer" verify --verbose --print-certs "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          sha256sum "$apk"

      - name: Upload APK only (never the keystore)
        uses: actions/upload-artifact@v4
        with:
          name: N-LIC-Dev-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      - name: Delete temporary signing material
        if: always()
        shell: bash
        run: rm -rf .signing
