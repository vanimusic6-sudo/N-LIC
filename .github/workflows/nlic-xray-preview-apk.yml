name: N-LIC Xray Core Preview APK (DEV signed Release)

on:
  push:
    branches: [feature/nlic-xray-core-20261104]
    paths:
      - app/**
      - .github/workflows/nlic-xray-preview-apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nlic-xray-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xray_preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      NLIC_INCLUDE_XRAY: "true"
      NLIC_ARM64_ONLY: "true"
      NLIC_DEV_SIGN_RELEASE_TEST: "true"
      NLIC_DEV_STORE_PASSWORD: ${{ secrets.NLIC_DEV_STORE_PASSWORD }}
      NLIC_DEV_KEY_PASSWORD: ${{ secrets.NLIC_DEV_KEY_PASSWORD }}
      NLIC_DEV_KEY_ALIAS: ${{ secrets.NLIC_DEV_KEY_ALIAS }}
      NLIC_DEV_KEYSTORE_BASE64: ${{ secrets.NLIC_DEV_KEYSTORE_BASE64 }}
      NLIC_DEV_KEYSTORE_PATH: ${{ github.workspace }}/.signing/nlic-dev.p12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"
          for attempt in 1 2 3 4; do
            if sdkmanager --install "ndk;27.2.12479018"; then
              test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
              break
            fi
            if [[ "$attempt" == 4 ]]; then exit 1; fi
            rm -rf "$ANDROID_HOME/.temp"
            sleep $((attempt * 6))
          done

      - name: Download pinned Xray v26.10.31 Android AAR and verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
            -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar"
          echo "2efdf731b1ed624eb1cb0d5a4d0aa95c0672e89f9702226d1ba2dc90308630b6  app/libs/libv2ray.aar" | sha256sum --check
          unzip -tqq app/libs/libv2ray.aar
          unzip -p app/libs/libv2ray.aar classes.jar > /tmp/nlic-xray-classes.jar
          javap -classpath /tmp/nlic-xray-classes.jar libv2ray.Libv2ray > /tmp/nlic-xray-api.txt
          javap -classpath /tmp/nlic-xray-classes.jar libv2ray.CoreController >> /tmp/nlic-xray-api.txt
          grep -q 'newCoreController' /tmp/nlic-xray-api.txt
          grep -q 'initCoreEnv' /tmp/nlic-xray-api.txt
          grep -q 'startLoop' /tmp/nlic-xray-api.txt
          grep -q 'stopLoop' /tmp/nlic-xray-api.txt

      - name: Restore isolated DEV signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NLIC_DEV_KEYSTORE_BASE64"
          test -n "$NLIC_DEV_STORE_PASSWORD"
          test -n "$NLIC_DEV_KEY_PASSWORD"
          test -n "$NLIC_DEV_KEY_ALIAS"
          mkdir -p .signing
          chmod 700 .signing
          printf '%s' "$NLIC_DEV_KEYSTORE_BASE64" | base64 --decode > "$NLIC_DEV_KEYSTORE_PATH"
          chmod 600 "$NLIC_DEV_KEYSTORE_PATH"

      - name: Assemble release, test compiler and lint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease \
            --no-daemon --stacktrace

      - name: Validate DEV-signed Xray ARM64 release output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xray-preview
          apk="$(find app/build/outputs/apk/release -type f -name '*arm64-v8a*release*.apk' -print -quit)"
          test -s "$apk"
          cp "$apk" xray-preview/N-LIC-XrayPreview-arm64-Release-DEV.apk
          apk=xray-preview/N-LIC-XrayPreview-arm64-Release-DEV.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > xray-preview/SIGNATURE.txt
          grep -iq '9eac8ece5fb89eeacb03c5eff20155724a206d73180d58c78fc7d3911dbee5c5' xray-preview/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > xray-preview/APK_METADATA.txt
          grep -q 'io.github.vanimusic6sudo.nlic' xray-preview/APK_METADATA.txt
          if grep -q '^application-debuggable' xray-preview/APK_METADATA.txt; then exit 1; fi
          python3 - "$apk" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              entries = set(z.namelist())
              assert 'classes.dex' in entries, 'Missing Dalvik code'
              libs = [n for n in entries if n.startswith('lib/arm64-v8a/') and n.endswith('.so')]
              assert libs, 'Native ARM64 library missing'
              assert any('gojni' in n.lower() for n in libs), f'Gomobile JNI missing: {libs}'
          PY
          cat > xray-preview/READ_ME_FIRST.txt <<'EOF'
          N-LIC experimental Xray preview, DEV-signed optimized Release.
          Xray-core provided by 2dust/AndroidLibXrayLite v26.10.31.
          Native AAR SHA256:
          2efdf731b1ed624eb1cb0d5a4d0aa95c0672e89f9702226d1ba2dc90308630b6
          Supported experimental profiles: VLESS TLS/REALITY, VMess,
          Trojan, Shadowsocks, wg-quick WireGuard.
          LIC-Auto and LIC-Bay are unavailable in this preview.
          Xray uses an authenticated private SOCKS inbound plus HEV Android TUN.
          This is not a production security-tested VPN. Check for leaks.
          Do not disable Play Protect and do not use for sensitive data.
          EOF
          sha256sum "$apk" > xray-preview/SHA256SUMS.txt

      - name: Publish Xray preview APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: N-LIC-XrayPreview-ARM64-DevSigned
          path: xray-preview/
          if-no-files-found: error
          retention-days: 14

      - name: Sanitize workspace
        if: always()
        shell: bash
        run: |
          rm -rf .signing
          rm -f app/libs/libv2ray.aar
