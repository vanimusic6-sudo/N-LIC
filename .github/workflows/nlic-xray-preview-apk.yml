name: N-LIC Android TV DEV APK

on:
  push:
    branches: [feature/nlic-xray-core-20261104, feature/nlic-dual-mode-resilience-20261104 , feature/nlic-v2-ui-core, feature/lic-assist-reality-tcp-20261105, feature/lic-reality-smart-assist-20261105, fix/lic-reality-visible-status-20261105, fix/lic-assist-main-switch-20261105, feature/lic-assist-reality-ab-test-20261105, feature/lic-reality-diagnostics-v2-20261105, feature/lic-reality-stream-pcap-audit-20261105, feature/lic-reality-adaptive-selection-20261105, feature/lic-reality-transport-tricks-20261105, fix/lic-assist-unified-workbench-20261105, feature/lic-helper-dual-firstflight-20261106, feature/lic-helper-hardening-thermal-20261106, feature/nlic-field-failover-20261111, feature/nlic-xhttp-real-transport-20261111, feature/nlic-awg31-packet-engine-20261112, feature/nlic-one-tap-resilience-20261112, feature/nlic-android-tv-20261121, fix/nlic-tv-universal-pair-20261121, feature/nlic-215-secure-tv-20261122, feature/nlic-216-adaptive-auto-recovery-20261122]
    paths:
      - app/**
      - settings.gradle.kts
      - tools/reality_clienthello_audit.py
      - tests/nlic-v2/test_reality_clienthello_audit.py
      - .github/workflows/nlic-xray-preview-apk.yml
      - tests/nlic-tv/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nlic-xray-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xray_preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: write # Cancel only stale previews on this same branch.
    env:
      NLIC_INCLUDE_XRAY: "true"
      NLIC_ARM64_ONLY: "false"
      NLIC_TV_MULTI_ABI: "true"
      NLIC_DEV_SIGN_RELEASE_TEST: "true"
      NLIC_DEV_STORE_PASSWORD: ${{ secrets.NLIC_DEV_STORE_PASSWORD }}
      NLIC_DEV_KEY_PASSWORD: ${{ secrets.NLIC_DEV_KEY_PASSWORD }}
      NLIC_DEV_KEY_ALIAS: ${{ secrets.NLIC_DEV_KEY_ALIAS }}
      NLIC_DEV_KEYSTORE_BASE64: ${{ secrets.NLIC_DEV_KEYSTORE_BASE64 }}
      NLIC_DEV_KEYSTORE_PATH: ${{ github.workspace }}/.signing/nlic-dev.p12
    steps:
      - name: Cancel stale V2 runs before building (best effort)
        if: github.ref == 'refs/heads/feature/nlic-v2-ui-core'
        shell: bash
        env:
          GH_ACTIONS_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ['REPOSITORY']
          current = int(os.environ['CURRENT_RUN_ID'])
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_ACTIONS_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          url = f'https://api.github.com/repos/{repo}/actions/runs?branch=feature/nlic-v2-ui-core&per_page=100'
          try:
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers=headers), timeout=15,
              ) as response:
                  runs = json.load(response).get('workflow_runs', [])
          except (OSError, ValueError) as error:
              print('Could not list old runs; normal concurrency still applies:', type(error).__name__)
              runs = []
          total = 0
          for run in runs:
              if run.get('id', current) >= current or run.get('head_branch') != 'feature/nlic-v2-ui-core':
                  continue
              if run.get('status') not in ('queued', 'in_progress', 'pending', 'waiting', 'requested'):
                  continue
              previous = run['id']
              cancel_url = f'https://api.github.com/repos/{repo}/actions/runs/{previous}/cancel'
              request = urllib.request.Request(cancel_url, data=b'', headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(request, timeout=8):
                      total += 1
              except urllib.error.HTTPError as error:
                  if error.code not in (404, 409, 422):
                      print('Could not cancel run', previous, 'HTTP', error.code)
              except OSError:
                  print('Could not cancel run', previous, '(network)')
          print('Cancellation requests sent for', total, 'superseded V2 runs.')
          PY

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Validate V2 one-screen settings and permissions
        shell: bash
        run: |
          python3 tests/nlic-v2/test_ui_contract.py
          python3 tests/nlic-v2/test_reality_clienthello_audit.py
          python3 tests/nlic-tv/test_tv_contract.py
          python3 tests/nlic-tv/test_pair_security_contract.py

      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"
          for attempt in 1 2 3 4; do
            if sdkmanager --install "ndk;27.2.12479018"; then
              test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
              break
            fi
            if [[ "$attempt" == 4 ]]; then exit 1; fi
            rm -rf "$ANDROID_HOME/.temp"
            sleep $((attempt * 6))
          done

      - name: Download pinned Xray v26.10.31 Android AAR and verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
            -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar"
          echo "2efdf731b1ed624eb1cb0d5a4d0aa95c0672e89f9702226d1ba2dc90308630b6  app/libs/libv2ray.aar" | sha256sum --check
          unzip -tqq app/libs/libv2ray.aar
          unzip -p app/libs/libv2ray.aar classes.jar > /tmp/nlic-xray-classes.jar
          javap -classpath /tmp/nlic-xray-classes.jar libv2ray.Libv2ray > /tmp/nlic-xray-api.txt
          javap -classpath /tmp/nlic-xray-classes.jar libv2ray.CoreController >> /tmp/nlic-xray-api.txt
          grep -q 'newCoreController' /tmp/nlic-xray-api.txt
          grep -q 'initCoreEnv' /tmp/nlic-xray-api.txt
          grep -q 'startLoop' /tmp/nlic-xray-api.txt
          grep -q 'stopLoop' /tmp/nlic-xray-api.txt
          # Fail closed if this pinned gomobile AAR cannot run on 32-bit TVs.
          unzip -Z1 app/libs/libv2ray.aar > /tmp/nlic-xray-aar-entries.txt
          grep -Eq '^jni/armeabi-v7a/.*gojni.*\.so$' /tmp/nlic-xray-aar-entries.txt
          grep -Eq '^jni/arm64-v8a/.*gojni.*\.so$' /tmp/nlic-xray-aar-entries.txt

      - name: Restore isolated DEV signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NLIC_DEV_KEYSTORE_BASE64"
          test -n "$NLIC_DEV_STORE_PASSWORD"
          test -n "$NLIC_DEV_KEY_PASSWORD"
          test -n "$NLIC_DEV_KEY_ALIAS"
          mkdir -p .signing
          chmod 700 .signing
          printf '%s' "$NLIC_DEV_KEYSTORE_BASE64" | base64 --decode > "$NLIC_DEV_KEYSTORE_PATH"
          chmod 600 "$NLIC_DEV_KEYSTORE_PATH"

      - name: Assemble release, test compiler and lint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease \
            --no-daemon --stacktrace

      - name: Verify signed ARMv7, ARM64 and universal TV APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xray-preview
          for target in armeabi-v7a arm64-v8a universal; do
            apk="$(find app/build/outputs/apk/release -type f -name "*$target*release*.apk" -print -quit)"
            test -s "$apk"
            cp "$apk" "xray-preview/N-LIC-2.1.6-TV-$target-DEV.apk"
            output="xray-preview/N-LIC-2.1.6-TV-$target-DEV.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$output" > /tmp/nlic-tv-signature.txt
            grep -iq '9eac8ece5fb89eeacb03c5eff20155724a206d73180d58c78fc7d3911dbee5c5' /tmp/nlic-tv-signature.txt
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$output" > /tmp/nlic-tv-metadata.txt
            grep -q 'io.github.vanimusic6sudo.nlic' /tmp/nlic-tv-metadata.txt
            grep -q "versionCode='2106'" /tmp/nlic-tv-metadata.txt
            if grep -q '^application-debuggable' /tmp/nlic-tv-metadata.txt; then exit 1; fi
          done
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          base = Path("xray-preview")
          for target, abis in (
              ("armeabi-v7a", ("armeabi-v7a",)),
              ("arm64-v8a", ("arm64-v8a",)),
              ("universal", ("armeabi-v7a", "arm64-v8a")),
          ):
              apk = base / f"N-LIC-2.1.6-TV-{target}-DEV.apk"
              with ZipFile(apk) as z:
                  entries = set(z.namelist())
                  assert "classes.dex" in entries
                  for abi in abis:
                      libs = [name for name in entries if
                              name.startswith(f"lib/{abi}/") and name.endswith(".so")]
                      assert any("gojni" in x.lower() for x in libs), (target, abi, "Xray JNI missing")
                      assert f"lib/{abi}/libnlicv2.so" in entries, (target, abi, "Native core missing")
                      assert f"lib/{abi}/libbyedpi.so" in entries, (target, abi, "ByeDPI missing")
              print("Validated", apk, tuple(abis))
          PY
          cat > xray-preview/READ_ME_FIRST.txt <<'EOF'
          N-LIC 2.1.6 TV Resilience DEV. Experimental Android TV + phone build.
          Choose armeabi-v7a for 32-bit TV OS, arm64-v8a for 64-bit TV OS.
          The universal APK contains both ABIs and is the safest first try.
          Minimum Android version: 7.0 (API 24) when Xray is included.

          On TV: 'Get subscription from phone' shows a temporary QR.
          On phone: install the SAME DEV-signed version of N-LIC, scan QR,
          select an existing N-LIC subscription or paste its HTTPS URL / links.
          LAN transfers are one-time, AES-256-GCM authenticated, max 2 MiB,
          no cloud relay. Do not share QR or subscription tokens.
          Permission to establish an Android VPN is still requested by OS.
          Android TV hardware, per-OEM VPN dialogs and traffic leaks still
          require real-device validation. Do not use for sensitive traffic.
          ZXing core 3.5.3 is licensed under Apache License 2.0.
          EOF
          (cd xray-preview && sha256sum N-LIC-2.1.6-TV-*-DEV.apk > SHA256SUMS.txt)

      - name: Publish Xray preview APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: N-LIC-TV-Universal-DevSigned
          path: xray-preview/
          if-no-files-found: error
          retention-days: 14

      - name: Sanitize workspace
        if: always()
        shell: bash
        run: |
          rm -rf .signing
          rm -f app/libs/libv2ray.aar

  publish_one_tap_dev:
    name: Publish verified One-Tap DEV APK to GitHub Releases
    needs: xray_preview
    if: github.ref == 'refs/heads/feature/nlic-one-tap-resilience-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v2.1.2-dev-20261112
    steps:
      - name: Download exact artifact from the successful build in this run
        uses: actions/download-artifact@v4
        with:
          name: N-LIC-V2-ARM64-DevSigned
          path: dist
      - name: Verify APK checksum and publish DEV release
        shell: bash
        run: |
          set -euo pipefail
          apk=dist/N-LIC-2.1.2-OneTap-arm64-DEV.apk
          test -s "$apk"
          expected="$(awk 'NF { print $1; exit }' dist/SHA256SUMS.txt)"
          actual="$(sha256sum "$apk" | awk '{ print $1 }')"
          test -n "$expected"
          test "$actual" = "$expected"
          printf '%s  %s\n' "$actual" "$(basename "$apk")" > dist/SHA256SUMS.txt
          cat > /tmp/release-notes.md <<'NOTES'
          N-LIC 2.1.2 DEV · ARM64 · оптимизированная Release-сборка с DEV-подписью.

          Скачайте **N-LIC-2.1.2-OneTap-arm64-DEV.apk** в Assets ниже.

          - Главный экран с одной большой кнопкой; настройки подключения раскрываются отдельно.
          - LIC Auto использует все совместимые импортированные локации, без прежнего ограничения 6/12/24.
          - Одно ядро сравнивает HTTPS-задержку маршрутов и выбирает лучший для новых соединений без перезапуска VPN; уже открытые потоки остаются на своём маршруте.
          - Защитные варианты LIC-helper участвуют в Auto вместе с исходными REALITY-профилями.
          - Автовосстановление после первой неудачной попытки, повторный поиск при потере связи и ожидание появления сети.
          - Параллельные HTTPS-проверки с отменой оставшихся запросов после успеха; кнопка «Остановить» работает во время подключения и восстановления.
          - Яркая жёлтая иконка с контрастным знаком N.

          APK публикуется только после успешной сборки, модульных тестов, lint и проверки DEV-подписи. Обход на конкретном операторе и работа на телефоне требуют полевой проверки.
          NOTES
          printf '\nCommit: `%s`\nBuild: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> /tmp/release-notes.md
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$apk" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'N-LIC 2.1.2 DEV — одна кнопка (ARM64)' \
            --notes-file /tmp/release-notes.md --prerelease --latest=false

  publish_android_tv_dev:
    name: Publish verified 32/64-bit TV APKs
    needs: xray_preview
    if: github.ref == 'refs/heads/fix/nlic-tv-universal-pair-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v2.1.4-tv-universal-20261121
    steps:
      - name: Download signed TV APKs
        uses: actions/download-artifact@v4
        with:
          name: N-LIC-TV-Universal-DevSigned
          path: dist
      - name: Verify checksums and publish Android TV pre-release
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          for variant in armeabi-v7a arm64-v8a universal; do
            test -s "dist/N-LIC-2.1.4-TV-$variant-DEV.apk"
          done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $RELEASE_TAG" >&2
            exit 1
          fi
          cat > /tmp/tv-notes.md <<'NOTES'
          N-LIC 2.1.4 TV DEV — Android TV и Google TV с Android 7+.

          **Выбирайте universal APK**, если не знаете разрядность системы.
          В релизе также отдельные armeabi-v7a (32-битная система) и arm64-v8a (64-битная система).

          Передача подписки:
          1. Установите этот же DEV APK на Android-телефон.
          2. На телевизоре выберите «Получить подписку с телефона».
          3. Сканируйте QR камерой и откройте N-LIC.
          4. Выберите подписку из N-LIC либо вставьте HTTPS-ссылку/профиль.
          5. Подтвердите отправку. Подписка передаётся по локальной сети
             с AES-256-GCM и одноразовым 256-битным ключом.

          Телефон и ТВ должны находиться в одной Wi-Fi/Ethernet сети.
          Код действует только 2 минуты. Внешнего сервера нет.
          Android VPN разрешение по-прежнему запрашивается системой.

          Проект экспериментальный: реальная работа на разных ТВ и защита
          от DNS/IP утечек требуют проверки на устройстве.
          APK подписан DEV-ключом. Не отключайте Play Protect.
          ZXing core 3.5.3 (Apache-2.0) используется для QR-кода.
          NOTES
          printf '\nCommit: %s\nBuild: https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> /tmp/tv-notes.md
          gh release create "$RELEASE_TAG" \
            dist/N-LIC-2.1.4-TV-armeabi-v7a-DEV.apk \
            dist/N-LIC-2.1.4-TV-arm64-v8a-DEV.apk \
            dist/N-LIC-2.1.4-TV-universal-DEV.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'N-LIC 2.1.4 TV DEV — universal + encrypted pairing' \
            --notes-file /tmp/tv-notes.md --prerelease --latest=false
