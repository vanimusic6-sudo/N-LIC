name: N-LIC Release APK (manual, protected)

on:
  workflow_dispatch:
    inputs:
      security_review_approved:
        description: "I reviewed the security report and am authorizing a release build"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build signed N-LIC Release
    if: github.ref == 'refs/heads/master' && inputs.security_review_approved == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: nlic-release
    env:
      NLIC_RELEASE_STORE_PASSWORD: ${{ secrets.NLIC_RELEASE_STORE_PASSWORD }}
      NLIC_RELEASE_KEY_PASSWORD: ${{ secrets.NLIC_RELEASE_KEY_PASSWORD }}
      NLIC_RELEASE_KEY_ALIAS: ${{ secrets.NLIC_RELEASE_KEY_ALIAS }}
      NLIC_RELEASE_KEYSTORE_BASE64: ${{ secrets.NLIC_RELEASE_KEYSTORE_BASE64 }}
      NLIC_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/.signing/nlic-release.p12

    steps:
      - name: Checkout pinned sources and native submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install pinned Android build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Restore separate RELEASE key from protected environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NLIC_RELEASE_KEYSTORE_BASE64"
          test -n "$NLIC_RELEASE_STORE_PASSWORD"
          test -n "$NLIC_RELEASE_KEY_PASSWORD"
          test -n "$NLIC_RELEASE_KEY_ALIAS"
          mkdir -p .signing
          chmod 700 .signing
          printf '%s' "$NLIC_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$NLIC_RELEASE_KEYSTORE_PATH"
          chmod 600 "$NLIC_RELEASE_KEYSTORE_PATH"
          keytool -list -keystore "$NLIC_RELEASE_KEYSTORE_PATH" \
            -storepass:env NLIC_RELEASE_STORE_PASSWORD -alias "$NLIC_RELEASE_KEY_ALIAS" >/dev/null

      - name: Assemble optimized signed release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:lintRelease --no-daemon --stacktrace

      - name: Verify independent release identity and archive
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f -name '*universal*release*.apk' -print -quit)"
          test -s "$apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$apksigner" verify --verbose --print-certs "$apk"
          package="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          test "$package" = "io.github.vanimusic6sudo.nlic"
          if "$aapt" dump badging "$apk" | grep -q '^application-debuggable'; then
            echo "Release must not be debuggable" >&2
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          sha256sum "$apk"

      - name: Publish private workflow artifact (NOT public release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: N-LIC-Release-Signed
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing files
        if: always()
        run: rm -rf .signing
