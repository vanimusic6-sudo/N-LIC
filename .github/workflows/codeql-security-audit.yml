name: N-LIC CodeQL security audit

on:
  push:
    branches:
      - master
      - feature/nlic-identity-security-20261103
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: nlic-codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, c-cpp]
    steps:
      - name: Checkout with pinned native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install native build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          queries: security-extended

      - name: Build target for CodeQL extraction
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Analyze source code
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
