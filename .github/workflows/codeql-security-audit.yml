name: N-LIC CodeQL security audit

on:
  push:
    branches:
      - master
      - feature/nlic-identity-security-20261103
      - feature/nlic-relay-network-diagnostics-20261103
      - fix/nlic-physical-diagnostics-20261103
      - fix/nlic-diagnostics-default-route-20261103
      - fix/nlic-carrier-connectivity-gate-20261103
      - feature/nlic-subscription-core-20261103
      - feature/nlic-singbox-plan-20261103
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: nlic-codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, c-cpp]
    steps:
      - name: Checkout with pinned native submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install native build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          queries: security-extended

      - name: Build target for CodeQL extraction
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Analyze source code
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: "/language:${{ matrix.language }}"
