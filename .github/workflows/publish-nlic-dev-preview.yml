name: Publish N-LIC 2.1.1 DEV preview to Releases

on:
  push:
    branches:
      - feature/lic-helper-hardening-thermal-20261106
    paths:
      - .github/workflows/publish-nlic-dev-preview.yml

permissions:
  actions: read
  contents: write

jobs:
  publish-preview:
    if: github.repository == 'vanimusic6-sudo/N-LIC'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '42271725858'
      SOURCE_ARTIFACT: N-LIC-V2-ARM64-DevSigned
      SOURCE_COMMIT: f460a32413724efe50d52e3717b1f2c773410b39
      RELEASE_TAG: v2.1.1-dev-20261109
    steps:
      - name: Verify source CI and download the exact built APK
        shell: bash
        run: |
          set -euo pipefail
          run_metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}")"
          test "$(jq -r '.status' <<< "$run_metadata")" = completed
          test "$(jq -r '.conclusion' <<< "$run_metadata")" = success
          test "$(jq -r '.head_sha' <<< "$run_metadata")" = "$SOURCE_COMMIT"
          test "$(jq -r '.head_branch' <<< "$run_metadata")" = feature/lic-helper-hardening-thermal-20261106
          mkdir -p dist
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir dist
          apk=dist/N-LIC-V2-2.1.1-arm64-Release-DEV.apk
          test -s "$apk"
          test -s dist/SHA256SUMS.txt
          test -s dist/READ_ME_FIRST.txt
          expected="$(awk 'NF {print $1; exit}' dist/SHA256SUMS.txt)"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
          printf '%s  %s\n' "$actual" "$(basename "$apk")" > dist/SHA256SUMS-release.txt
          echo "Validated source run ${SOURCE_RUN} and SHA256 ${actual}"

      - name: Publish public preview release with direct APK asset
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release ${RELEASE_TAG}" >&2
            exit 1
          fi
          cat > RELEASE_NOTES.md <<'NOTES'
          **Экспериментальная сборка N-LIC 2.1.1 (ARM64, DEV-подпись).**

          Скачайте `N-LIC-V2-2.1.1-arm64-Release-DEV.apk` из раздела **Assets** ниже. Распаковывать ZIP из GitHub Actions больше не нужно.

          - Исходный коммит: `f460a32413724efe50d52e3717b1f2c773410b39` (PR #33).
          - Источник APK: успешно завершённый GitHub Actions run [42271725858](https://github.com/vanimusic6-sudo/N-LIC/actions/runs/42271725858).
          - Файл собран в режиме Release, но подписан **тестовым DEV-ключом**, не production.
          - Поддерживается **ARM64**; другие архитектуры этим APK не охвачены.
          - Изменения LIC-helper, приватности и энергопотребления экспериментальные: Android-полевое тестирование и проверка DNS/IPv4/IPv6 утечек ещё необходимы.

          Не отключайте Play Protect ради установки и не используйте эту тестовую сборку для чувствительных данных. Позднее APK с production-подписью может потребовать переустановку.
          NOTES
          gh release create "$RELEASE_TAG" \
            dist/N-LIC-V2-2.1.1-arm64-Release-DEV.apk \
            dist/SHA256SUMS-release.txt \
            dist/READ_ME_FIRST.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --title 'N-LIC 2.1.1 — DEV Preview (ARM64)' \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            --latest=false
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
