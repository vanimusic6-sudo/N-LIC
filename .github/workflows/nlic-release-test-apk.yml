name: N-LIC Release TEST APK (DEV certificate)

on:
  push:
    branches: [feature/nlic-identity-security-20261103, feature/nlic-engine-refresh-20261103, feature/nlic-video-ip-diagnostics-20261103, feature/nlic-cellular-profiles-20261103, feature/nlic-relay-network-diagnostics-20261103, fix/nlic-physical-diagnostics-20261103, fix/nlic-diagnostics-default-route-20261103, fix/nlic-carrier-connectivity-gate-20261103, feature/nlic-subscription-core-20261103]
    paths:
      - app/**
      - .github/workflows/nlic-release-test-apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nlic-release-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Optimized Release TEST APK with DEV certificate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The 'release' build type is used. DEV key is intentionally reused
      # ONLY for an internal test build, not for official N-LIC releases.
      NLIC_DEV_SIGN_RELEASE_TEST: "true"
      NLIC_DEV_STORE_PASSWORD: ${{ secrets.NLIC_DEV_STORE_PASSWORD }}
      NLIC_DEV_KEY_PASSWORD: ${{ secrets.NLIC_DEV_KEY_PASSWORD }}
      NLIC_DEV_KEY_ALIAS: ${{ secrets.NLIC_DEV_KEY_ALIAS }}
      NLIC_DEV_KEYSTORE_BASE64: ${{ secrets.NLIC_DEV_KEYSTORE_BASE64 }}
      NLIC_DEV_KEYSTORE_PATH: ${{ github.workspace }}/.signing/nlic-dev.p12

    steps:
      - name: Checkout source and pinned native submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install pinned native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Restore temporary DEV key (never publish)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NLIC_DEV_KEYSTORE_BASE64"
          test -n "$NLIC_DEV_STORE_PASSWORD"
          test -n "$NLIC_DEV_KEY_PASSWORD"
          test -n "$NLIC_DEV_KEY_ALIAS"
          mkdir -p .signing
          chmod 700 .signing
          printf '%s' "$NLIC_DEV_KEYSTORE_BASE64" | base64 --decode > "$NLIC_DEV_KEYSTORE_PATH"
          chmod 600 "$NLIC_DEV_KEYSTORE_PATH"
          keytool -list -keystore "$NLIC_DEV_KEYSTORE_PATH" \
            -storepass:env NLIC_DEV_STORE_PASSWORD \
            -alias "$NLIC_DEV_KEY_ALIAS" >/dev/null

      - name: Assemble actual Release build with lint and unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:lintRelease :app:testReleaseUnitTest \
            --no-daemon --stacktrace

      - name: Verify APK identity, signature, permissions and optimization
        id: check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-test
          apk="$(find app/build/outputs/apk/release -type f -name '*universal*release*.apk' -print -quit)"
          test -s "$apk"
          cp "$apk" release-test/N-LIC-release-TEST-dev-signed.apk
          output="release-test/N-LIC-release-TEST-dev-signed.apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$apksigner" verify --verbose --print-certs "$output" > release-test/SIGNATURE.txt
          cat release-test/SIGNATURE.txt
          grep -iq '9eac8ece5fb89eeacb03c5eff20155724a206d73180d58c78fc7d3911dbee5c5' release-test/SIGNATURE.txt

          "$aapt" dump badging "$output" > release-test/APK_METADATA.txt
          package="$("$aapt" dump badging "$output" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          test "$package" = "io.github.vanimusic6sudo.nlic"
          if grep -q '^application-debuggable' release-test/APK_METADATA.txt; then
            echo "Not a Release: android:debuggable is enabled" >&2
            exit 1
          fi

          "$aapt" dump permissions "$output" > release-test/PERMISSIONS.txt
          if grep -E 'MANAGE_EXTERNAL_STORAGE|QUERY_ALL_PACKAGES|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|REQUEST_IGNORE_BATTERY_OPTIMIZATIONS|FOREGROUND_SERVICE_SPECIAL_USE' release-test/PERMISSIONS.txt; then
            echo "Overbroad manifest permission has reappeared" >&2
            exit 1
          fi

          cat > release-test/READ_ME_FIRST.txt <<'EOF'
          N-LIC Release TEST (not an official production release).
          Build variant: :app:assembleRelease, minified and resource-shrunk, not debuggable.
          Package: io.github.vanimusic6sudo.nlic (NOT .dev).
          Signing: existing N-LIC DEV certificate, NOT the future official release certificate.
          This build cannot update the .dev package, and will not be upgradeable to an
          official N-LIC release signed by a different production certificate.
          Google Play Protect previously blocked N-LIC builds as potentially harmful.
          This APK has NOT been confirmed safe. Do NOT disable or bypass Play Protect.
          Build success/signature verification is not a malware safety guarantee.
          EOF
          sha256sum "$output" > release-test/SHA256SUMS.txt

      - name: Save analysis files even if build fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: N-LIC-Release-Lint-Reports
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload only Release TEST APK and non-secret evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: N-LIC-Release-TEST-DevSigned
          path: release-test/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary key material
        if: always()
        shell: bash
        run: rm -rf .signing
