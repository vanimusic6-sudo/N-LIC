name: N-LIC Quality Gate

on:
  push:
    branches: [feature/nlic-cellular-profiles-20261103, feature/nlic-relay-network-diagnostics-20261103, fix/nlic-physical-diagnostics-20261103, fix/nlic-diagnostics-default-route-20261103, fix/nlic-carrier-connectivity-gate-20261103, feature/nlic-subscription-core-20261103, feature/nlic-libbox-config-20261103, feature/nlic-vpn-runtime-20261103, fix/nlic-core-bay-ui-security-20261103, feature/nlic-2-adaptive-vpn-ui-import-20261104, fix/nlic-native-core-protocol-compat-20261104, feature/nlic-xray-core-20261104, feature/nlic-dual-mode-resilience-20261104]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Run unit tests and export synthetic sing-box config fixtures
        shell: bash
        env:
          NLIC_EXPORT_NATIVE_FIXTURES: "1"
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
          test -f app/build/native-fixtures/vless.json

      - name: Validate every real config schema with upstream sing-box 1.14.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nlic-upstream
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 200 \
            -o /tmp/nlic-upstream/singbox.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz
          tar xzf /tmp/nlic-upstream/singbox.tar.gz -C /tmp/nlic-upstream
          engine="$(find /tmp/nlic-upstream -type f -name sing-box | head -1)"
          test -n "$engine"
          chmod +x "$engine"
          "$engine" version
          failures=0
          for f in app/build/native-fixtures/*.json; do
            echo "::group::Validate $f"
            if ! "$engine" check -c "$f"; then
              echo "::error file=$f::Generated config is rejected by sing-box 1.14.3"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          test "$failures" -eq 0

      - name: Upload internal debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nlic-phase1-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 5

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nlic-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
